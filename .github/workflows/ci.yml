name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline:
    name: Offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # Deterministic: stub model, stub embeddings, no network, no API key.
        run: pytest -q

  integration:
    name: Integration suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orchestration
          POSTGRES_PASSWORD: orchestration
          POSTGRES_DB: orchestration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orchestration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://orchestration:orchestration@localhost:5432/orchestration
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        # Real PostgreSQL and real Celery workers. Still no API key: the queue is
        # exercised with a sleeping probe task rather than a live model call.
        run: pytest -m integration -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t agent-orchestration:ci .

      - name: The CLI runs in the built image
        run: docker run --rm agent-orchestration:ci --help
