[project]
name = "agent-orchestration"
version = "0.1.0"
description = "Multi-agent orchestration system: supervisor delegation, dynamic subagents, tool use"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "langgraph==0.6.11",
    "langchain-anthropic==0.3.22",
    "langchain-openai==0.3.35",
    "pydantic==2.13.4",
    # Latest is the lightest available on py3.9 (80 transitive packages;
    # 0.4.x/0.5.x/1.0.x all resolve heavier).
    "chromadb==1.5.9",
    "celery[redis]==5.6.3",
    "psycopg[binary]==3.2.13",
    # Checkpointer for durable escalations (--durable).
    "langgraph-checkpoint-sqlite==2.0.11",
    # Already present via langsmith; declared because auth.py imports it directly.
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
orchestrate = "agent_orchestration.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_orchestration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real model API (excluded by default; run with -m live)",
    "integration: needs a running Redis broker and Celery workers (run with -m integration)",
]
addopts = "-m 'not live and not integration'"
